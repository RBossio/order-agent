# VentureOrder - Ambiente di sviluppo Odoo 19 Community
#
# Uso:
#   cp .env.example .env  # prima modifica le password!
#   make up               # avvia i servizi
#   make seed             # popola con dati sintetici
#   make smoke            # verifica funzionamento
#
# NOTA: in alcune VM Docker potrebbe richiedere network_mode: host
#       per la comunicazione tra container. Decommentare se necessario.

services:
  db:
    image: postgres:16
    container_name: vo_postgres
    # network_mode: host  # Decommentare se bridge non funziona
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vo_demo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    volumes:
      - vo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-vo_demo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  odoo:
    image: odoo:19.0
    container_name: vo_odoo
    # network_mode: host  # Decommentare se bridge non funziona
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db  # Usare "localhost" con network_mode: host
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    ports:
      - "${ODOO_PORT:-8069}:8069"
    volumes:
      - vo_odoo_data:/var/lib/odoo
      - vo_odoo_addons:/mnt/extra-addons
    command: >
      -- --database=${POSTGRES_DB:-vo_demo}
         --init=sale_management,stock,contacts,product
         --without-demo=all

volumes:
  vo_pgdata:
  vo_odoo_data:
  vo_odoo_addons:
