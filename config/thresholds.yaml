# Soglie del motore di validazione VentureOrder (§7 architettura v0.2).
# Sovrascrivibili per tenant.

# Tolleranza prezzo PO vs listino Odoo (percentuale).
price_tolerance_pct: 2.0

# Confidenza minima sui campi critici (EXT-01).
confidence_min: 0.90

# HDR-02: po_date oltre N giorni nel futuro / nel passato.
po_date_future_days: 7
po_date_past_days: 90

# QTY-02: moltiplicatore sul 99° percentile storico (architettura: 3×).
qty_anomaly_multiple: 3.0

# QTY-02: quantità ×100 rispetto a storico, confezione, o senza baseline.
qty_extreme_multiple: 100.0

# QTY-02: massimo assoluto di quantità per riga.
max_line_qty: 10000

# PRC-03: scostamento importo riga = max(assoluto, percentuale).
line_amount_abs_tol: 0.01
line_amount_pct_tol: 0.5

# TOT-01: scostamento totale = max(assoluto, percentuale).
total_abs_tol: 0.02
total_pct_tol: 0.1

# DUP-03: finestra in giorni e sovrapposizione minima delle righe.
similar_order_days: 3
similar_line_overlap: 0.80

# AUTO_POST: score minimo e storico cliente.
# 0,97 è la soglia del §7.1: non va abbassata. La confidenza deterministica
# dell'estrattore è tarata a 0,98 (accordo preprocessor+LLM: 0,99) così un
# ordine pulito può superarla. Vedi extract/README.md.
auto_post_min_score: 0.97
auto_post_min_approved_orders: 20
warn_score_penalty: 0.05

# SEC-01: dimensione massima allegato (20 MB, §7.2).
max_attachment_bytes: 20971520

# EXP-02: lunghezza massima descrizione X12 IMD.
x12_imd_max_length: 35

# Matching clienti (cascata TAX_ID 1,00 → EMAIL_DOMAIN 0,99 → FUZZY_NAME → ADDRESS).
# Non sono nel §6.6 (quello è sugli articoli). Scelte conservative per AUTO_POST 0,97:
# - 0,85: minimo fuzzy nome, allineato al cap articoli senza conferme
# - 0,95: nome esatto / soglia REVIEW (CUS-02). Sotto 0,97 così il solo nome
#   non abilita AUTO_POST; CUS-02 scatta su ogni FUZZY_NAME
# - 0,08: margine di ambiguità, uguale a item_fuzzy_margin (§6.6)
# - 0,90: match indirizzo (stesso ordine di grandezza di confidence_min / EXT-01)
customer_fuzzy_name_min: 0.85
customer_fuzzy_name_review: 0.95
customer_ambiguous_margin: 0.08
customer_address_min: 0.90

# Matching articoli (§6.6). Tarate sui seed 7/13/99 (varianti + ordini extra
# generati con quegli seed) e validate sul seed 42.
item_unresolved_min: 0.75
# §6.6 indica 0,92 per FUZZY alto; si resta a 0,89 per non raggiungere
# la soglia 0,9 (1 punto di margine sul target ≤ 1% di errori silenziosi).
item_fuzzy_high: 0.89
item_fuzzy_margin: 0.08
# Cap FUZZY senza conferme indipendenti (UoM, prezzo listino, misura/colore).
# Un esito ambiguo non supera mai questo cap (mai confidenza ≥ 0,9).
item_fuzzy_cap: 0.85
item_fuzzy_confirm_min: 2
item_xref_trusted: 1.00
item_xref_candidate: 0.95
item_seller_code: 0.98
item_gtin: 0.99
item_mpn: 0.97
item_mpn_solo: 0.93
# Conflitto tra metodi forti (§6.2): min(score) − 0,20, più ITM-04 REVIEW.
item_conflict_penalty: 0.20
